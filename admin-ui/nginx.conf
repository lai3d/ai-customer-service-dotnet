# ADMIN_API_UPSTREAM is substituted at container start by nginx's envsubst template
# mechanism only if this file were a template; it is not, so the upstream is fixed to the
# Compose service name. Deploying the UI elsewhere means editing this one line or serving
# the bundle from any static host and enabling CORS on the service (ADMIN_CORS_ORIGINS).
server {
    listen 8083;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No customer text is cached anywhere on this hop.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://app:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
