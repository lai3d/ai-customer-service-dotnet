# TEMPLATE ONLY -- every value below is a placeholder. Do not `kubectl apply -f` this file
# as-is, and do not fill it in and commit it.
#
# It lives in k8s/examples/ rather than k8s/ because of something the Java implementation of
# this system measured the hard way: sitting next to the other manifests, `kubectl apply -f
# k8s/` -- the first thing anyone types -- swept it up and replaced a working Secret with
# these placeholders. `kubectl apply -f <dir>` is not recursive, so a subdirectory does.
#
# Preferred: create the Secret imperatively, so real values never touch a file git sees.
#
#   kubectl -n ai-customer-service-dotnet create secret generic ai-customer-service-dotnet-secrets \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=POSTGRES_USER='csagent' \
#     --from-literal=POSTGRES_PASSWORD="$PGPASSWORD"
#
# Better still, beyond a demo cluster: External Secrets Operator, Sealed Secrets, or your
# cloud's secret manager over CSI. A plain Kubernetes Secret is base64, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: ai-customer-service-dotnet-secrets
  namespace: ai-customer-service-dotnet
  labels:
    app.kubernetes.io/name: ai-customer-service-dotnet
    app.kubernetes.io/component: app
type: Opaque
# stringData, not data: Kubernetes base64-encodes these. Using `data` invites someone to
# paste a base64 blob and assume it is protected.
stringData:
  # Only the selected provider's key is required, and startup fails immediately without it
  # rather than reporting healthy and 401ing every request.
  ANTHROPIC_API_KEY: "REPLACE_ME_WITH_ANTHROPIC_API_KEY"
  POSTGRES_USER: "REPLACE_ME_WITH_POSTGRES_USER"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_POSTGRES_PASSWORD"

  # The first operations admin, created only into an empty staff_account table and never
  # touched again. Belongs here rather than in the ConfigMap because it is a credential for
  # every customer conversation in the database. Both or neither; twelve characters or more.
  # ADMIN_ENABLED lives in the ConfigMap, because it is a switch and not a secret.
  #
  #   ADMIN_SEED_USERNAME: "root"
  #   ADMIN_SEED_PASSWORD: "$(openssl rand -base64 18)"
