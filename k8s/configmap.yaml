# Non-secret configuration. Every key is an environment variable the service reads directly
# -- see src/CustomerService/Config/AppConfig.cs, where each default has its reasoning next
# to it -- so changing one here does not require rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-customer-service-dotnet-config
  namespace: ai-customer-service-dotnet
  labels:
    app.kubernetes.io/name: ai-customer-service-dotnet
    app.kubernetes.io/component: app
data:
  # Where Postgres lives. These manifests deliberately do NOT ship a Postgres of their own:
  # conversation memory, the pgvector embeddings, tickets and the operational record share
  # one database, so it wants a real managed instance (RDS / Cloud SQL / CNPG) with backups
  # rather than a StatefulSet nobody owns. The database must have the `vector` extension
  # available.
  POSTGRES_HOST: "postgres.ai-customer-service-dotnet.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "csagent"

  CHAT_PROVIDER: "anthropic"

  # Must stay below terminationGracePeriodSeconds in the Deployment, or the kubelet SIGKILLs
  # the container part-way through the drain it was promised. A streamed answer is in
  # flight for as long as the model keeps talking.
  SHUTDOWN_GRACE: "30s"

  # How many callers may be inside the native embedding call at once.
  #
  # Set explicitly, and that is the .NET-specific part of this file. The default is
  # Environment.ProcessorCount, which .NET derives from the cgroup CPU limit -- so leaving it
  # at 0 makes the embedding concurrency depend on whether anyone set a CPU limit on this
  # container. With a limit it is small and correct; without one it becomes the node's core
  # count, and each caller inside ONNX Runtime is a thread-pool thread blocked in native
  # code. An explicit number does not move when someone edits `resources`.
  EMBEDDING_MAX_CONCURRENCY: "4"

  # A conversation is an open-ended bill unless capped. 0 disables the cap.
  CONVERSATION_TOKEN_BUDGET: "200000"

  # Off unless a collector is running. Point it at yours and set it to "true".
  OTLP_TRACING_EXPORT_ENABLED: "false"
  OTLP_TRACING_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
  TRACING_SAMPLE_RATE: "1.0"
  # A support question is often the most sensitive thing in a request, and traces are
  # retained and read widely. On only while debugging retrieval.
  TRACE_INCLUDE_QUERY_CONTENT: "false"

  # The operations surface. Off, the admin routes are never registered and /api/admin/v1 is
  # a 404 rather than a guarded 401. Turn it on here; the first admin's credentials belong in
  # the Secret (ADMIN_SEED_USERNAME / ADMIN_SEED_PASSWORD), not here.
  ADMIN_ENABLED: "false"
  ADMIN_SESSION_TIMEOUT: "30m"
  # Empty: the operations UI in k8s/admin-ui.yaml proxies /api to this Service, so the
  # browser sees one origin and no CORS is needed. Set only for a UI served from elsewhere.
  ADMIN_CORS_ORIGINS: ""

  # The runtime's diagnostics IPC socket wants a writable /tmp, and the pod has none: the
  # root filesystem is read-only and there are no volumes. Off, the runtime asks for nothing
  # on disk. Turn it back on with an emptyDir at /tmp if you need dotnet-counters or a dump.
  DOTNET_EnableDiagnostics: "0"
  LOG_LEVEL: "Information"
