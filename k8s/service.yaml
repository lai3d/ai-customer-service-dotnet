apiVersion: v1
kind: Service
metadata:
  name: ai-customer-service-dotnet
  namespace: ai-customer-service-dotnet
  labels:
    app.kubernetes.io/name: ai-customer-service-dotnet
    app.kubernetes.io/component: app
spec:
  # ClusterIP: exposing this is an Ingress/Gateway decision, and the chat API has no
  # authentication (deliberately), so do not reach for LoadBalancer without putting
  # something in front of it.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-customer-service-dotnet
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
  # Conversation memory is keyed by conversation id in Postgres, so any replica can serve
  # any turn. But the per-conversation lock is per process, so two replicas can still
  # interleave one conversation. Affinity would paper over that; fixing it properly means
  # Postgres advisory locks on the conversation id.
  sessionAffinity: None
